name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试
        run: npm test
      - name: CLI 冒烟
        run: |
          node bin/ipv4.js info 10.0.0.0/22
          node bin/ipv4.js split 192.168.0.0/24 26
          node bin/ipv4.js contains 10.0.0.0/8 10.1.2.3
